<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>LCDK | Movimientos</title>
        <link rel="icon" type="image/png" href="../aseets/logo2.png">
        <link rel="stylesheet" href="../css/movimientos.css">
    </head>
    <body>
        <header class="topbar">
            <div class="topbar-inner">
                <a href="app.html" aria-label="Ir al inicio"><img src="../aseets/logo2.png" alt="logo" class="logo"></a>
                <h1 class="brand">LCDKK</h1>
                <a href="cuenta.html" class="icon-btn">Perfil</a>
            </div>
        </header>

        <main class="page-shell">
            <section class="page-header">
                <div>
                    <p class="eyebrow">Resumen</p>
                    <h2>Movimientos</h2>
                </div>
                <button class="primary-btn" type="button">Filtrar</button>
            </section>

            <section class="summary-grid">
                <article class="glass-card stat-card">
                    <span class="label">Ingresos</span>
                    <strong class="positive" id="ingresosTotal">$0,00</strong>
                </article>
                <article class="glass-card stat-card">
                    <span class="label">Gastos</span>
                    <strong class="negative" id="gastosTotal">$0,00</strong>
                </article>
                <article class="glass-card stat-card highlight">
                    <span class="label">Saldo</span>
                    <strong id="saldoMovimientos">Cargando...</strong>
                </article>
            </section>

            <section class="filter-bar glass-card">
                <button class="filter active" type="button">Todos</button>
                <button class="filter" type="button">Ingresos</button>
                <button class="filter" type="button">Gastos</button>
                <button class="filter" type="button">Transferencias</button>
            </section>

            <section class="movement-panel glass-card">
                <div class="movement-header">
                    <h3>Últimos movimientos</h3>
                    <button class="ghost-btn" type="button">Ver todo</button>
                </div>

                <ul class="movement-list" id="movementList">
                    <li class="movement-item empty-state">
                        <div class="movement-left">
                            <span class="movement-icon transfer">-</span>
                            <div>
                                <strong>Sin movimientos aún</strong>
                                <small>Tu historial aparecerá aquí</small>
                            </div>
                        </div>
                        <div class="movement-right">
                            <span class="amount">$0,00</span>
                            <small>Hoy</small>
                        </div>
                    </li>
                </ul>
            </section>
        </main>

        <nav class="bottom-nav">
            <span class="nav-indicator" aria-hidden="true"></span>
            <a href="app.html" class="nav-item">Inicio</a>
            <a href="movimientos.html" class="nav-item active">Movimientos</a>
            <a href="cuenta.html" class="nav-item">Cuenta</a>
            <a href="mas.html" class="nav-item">Más</a>
        </nav>

        <script>
            document.addEventListener('DOMContentLoaded', () => {
                const nav = document.querySelector('.bottom-nav');
                const indicator = nav?.querySelector('.nav-indicator');
                const items = Array.from(nav?.querySelectorAll('.nav-item') || []);
                if (!nav || !indicator || !items.length) return;

                const moveIndicator = (target) => {
                    const navRect = nav.getBoundingClientRect();
                    const targetRect = target.getBoundingClientRect();
                    indicator.style.width = `${targetRect.width}px`;
                    indicator.style.transform = `translateX(${targetRect.left - navRect.left}px)`;
                };

                const current = items.find(item => item.classList.contains('active')) || items[0];
                moveIndicator(current);

                window.addEventListener('resize', () => {
                    const active = document.querySelector('.nav-item.active') || items[0];
                    moveIndicator(active);
                });

                items.forEach((item) => {
                    item.addEventListener('click', () => {
                        items.forEach((el) => el.classList.remove('active'));
                        item.classList.add('active');
                        moveIndicator(item);
                    });
                });
            });
        </script>
    <script src="../js/movimientos.js"></script>
    </body>
</html>
