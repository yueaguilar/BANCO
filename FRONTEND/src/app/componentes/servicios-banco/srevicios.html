<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>LCDK | Servicios</title>
        <link rel="icon" type="image/png" href="../aseets/logo2.png">
        <link rel="stylesheet" href="./app.css">
        <link rel="stylesheet" href="./servicios.css">
    </head>
    <body>
        <header class="topbar">
            <div class="topbar-inner">
                <a href="app.html" class="icon-btn back-btn" aria-label="Volver al inicio">← Volver</a>
                <h1 class="brand">LCDKK</h1>
                <a href="cuenta.html" class="icon-btn">Perfil</a>
            </div>
        </header>

        <main class="servicios-shell">
            <section class="servicios-header">
                <div>
                    <p class="eyebrow">Servicios</p>
                    <h2>Pagar servicios</h2>
                </div>
                <button class="tag-btn" id="quickServiceBtn" type="button">Servicio rápido</button>
            </section>

            <section class="servicios-card">
                <div class="destination-row">
                    <div class="destination-meta">
                        <span class="label">Proveedor</span>
                        <strong id="providerLabel">Edenor</strong>
                    </div>
                    <button class="chip-btn" id="changeServiceBtn" type="button">Cambiar</button>
                </div>

                <label class="field-label" for="serviceNumberInput">Número de servicio</label>
                <input id="serviceNumberInput" class="text-input" type="text" value="4598123" maxlength="20" placeholder="Ingresá tu número de servicio">

                <label class="field-label" for="serviceTypeInput">Concepto</label>
                <input id="serviceTypeInput" class="text-input" type="text" value="Factura de luz" maxlength="40">

                <label class="field-label" for="amountInput">Monto</label>
                <div class="amount-box">
                    <span class="currency">$</span>
                    <input id="amountInput" type="number" min="1" step="0.01" value="2450" placeholder="0,00">
                </div>

                <div class="summary-box">
                    <div class="summary-line">
                        <span>Monto</span>
                        <strong id="summaryAmount">$ 2.450,00</strong>
                    </div>
                    <div class="summary-line">
                        <span>Comisión</span>
                        <strong id="summaryFee">$ 0,00</strong>
                    </div>
                    <div class="summary-line total">
                        <span>Total</span>
                        <strong id="summaryTotal">$ 2.450,00</strong>
                    </div>
                </div>
            </section>

            <div class="servicios-actions">
                <button id="cancelBtn" type="button" class="secondary-btn">Cancelar</button>
                <button id="confirmBtn" type="button" class="primary-btn">Confirmar pago</button>
            </div>
        </main>

        <div id="successModal" class="success-modal hidden" role="dialog" aria-modal="true">
            <div class="success-card">
                <div class="success-icon">✓</div>
                <h3>¡Servicio pagado!</h3>
                <p id="successMessage">Tu pago de $ 2.450,00 fue realizado.</p>
                <button id="backHomeBtn" type="button" class="primary-btn full">Volver al inicio</button>
            </div>
        </div>

        <script src="./servicios.js"></script>
    </body>
</html>
