<header class="topbar">
    <div class="topbar-inner">
        <a routerLink="/app" aria-label="Ir al inicio"><img src="/logo2.png" alt="logo" class="logo"></a>
        <h1 class="brand">LCDKK</h1>
        <a routerLink="/cuenta" class="icon-btn" id="profileBtn">Perfil</a>
    </div>
</header>

<main class="payment-shell">
    <section class="payment-header">
        <div>
            <p class="eyebrow">Pago</p>
            <h2>Nuevo pago</h2>
        </div>
        <button class="tag-btn" id="quickPayBtn" type="button">Pago rápido</button>
    </section>

    <section class="payment-card">
        <div class="destination-row">
            <div class="destination-meta">
                <span class="label">Destino</span>
                <strong id="destinoLabel">Nuevo destino</strong>
            </div>
            <button class="chip-btn" id="changeDestinyBtn" type="button">Cambiar</button>
        </div>

        <label class="field-label" for="amountInput">Monto</label>
        <div class="amount-box">
            <span class="currency">$</span>
            <input id="amountInput" type="number" min="1" step="0.01" value="" placeholder="0,00">
        </div>

        <label class="field-label" for="conceptInput">Concepto</label>
        <input id="conceptInput" class="text-input" type="text" value="" maxlength="40" placeholder="Ingresá el concepto">

        <label class="field-label">Método de pago</label>
        <div class="payment-methods">
            <button class="method active" type="button" data-method="saldo">Saldo disponible</button>
            <button class="method" type="button" data-method="tarjeta">Tarjeta</button>
            <button class="method" type="button" data-method="transferencia">Transferencia</button>
        </div>

        <div class="summary-box">
            <div class="summary-line">
                <span>Monto</span>
                <strong id="summaryAmount">$ 0,00</strong>
            </div>
            <div class="summary-line">
                <span>Comisión</span>
                <strong id="summaryFee">$ 0,00</strong>
            </div>
            <div class="summary-line total">
                <span>Total</span>
                <strong id="summaryTotal">$ 0,00</strong>
            </div>
        </div>
    </section>

    <div class="payment-actions">
        <button id="cancelBtn" type="button" class="secondary-btn">Cancelar</button>
        <button id="confirmBtn" type="button" class="primary-btn">Confirmar pago</button>
    </div>
</main>

<div id="successModal" class="success-modal hidden" role="dialog" aria-modal="true">
    <div class="success-card">
        <div class="success-icon">✓</div>
        <h3>¡Pago realizado!</h3>
        <p id="successMessage">Tu pago será confirmado.</p>
        <button id="backHomeBtn" type="button" class="primary-btn full">Volver al inicio</button>
    </div>
</div>
