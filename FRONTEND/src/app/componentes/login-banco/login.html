<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>LCDK</title>
        <link rel="icon" type="image/png" href="../aseets/logo2.png">
        <link rel="stylesheet" href="./login.css">
    </head>
    <body>
        <div class="inicio">
            <h1 id="titulo">Inicio de sesion o Regsitro de nueva cuenta</h1>
        </div>
        <div class="info">
            <form id="auth-form" class="login-form">
                <input id="email" class="correo liquid-glass-input" type="email" name="email" placeholder="Correo electrónico" required>
                <input id="fullname" class="liquid-glass-input" type="text" name="fullname" placeholder="Nombre completo">
                <label class="small">Fecha de nacimiento</label>
                <input id="birthdate" class="liquid-glass-input" type="date" name="birthdate">
                <input id="phone" class="liquid-glass-input" type="tel" inputmode="numeric" maxlength="10" name="phone" placeholder="Número de celular (10 dígitos)" required>
                <div style="display:flex;align-items:center;gap:8px;">
                    <input id="password" class="liquid-glass-input" type="password" name="password" placeholder="Contraseña" required>
                    <label style="font-size:0.9rem;display:flex;align-items:center;gap:6px;">
                        <input id="toggle-password" type="checkbox"> Mostrar
                    </label>
                </div>
                <button type="submit" class="correo liquid-glass-btn">Enviar código y continuar</button>
            </form>
        </div>
        <script src="./login.js"></script>
    </body>
</html>
