<main class="auth-shell">
  <section class="auth-card">
    <header class="auth-header">
      <img src="/logo2.png" alt="Logo de Banco LCDK" class="logo">
      <p class="eyebrow">Bienvenido de nuevo</p>
      <h1>Iniciar sesión</h1>
      <p class="intro">Accede a tu cuenta con tu número de cuenta y contraseña.</p>
    </header>

    <form class="login-form" (ngSubmit)="iniciarSesionConCuenta()">
      <label for="accountNumber">Número de cuenta</label>
      <input id="accountNumber" class="liquid-glass-input" type="text" inputmode="numeric"
             autocomplete="username" maxlength="10" name="accountNumber"
             placeholder="Ingresa los 10 dígitos" [(ngModel)]="accountNumber" required>

      <label for="accountPassword">Contraseña</label>
      <input id="accountPassword" class="liquid-glass-input" type="password"
             autocomplete="current-password" name="accountPassword"
             placeholder="Ingresa tu contraseña" [(ngModel)]="password" required>

      <button type="submit" class="liquid-glass-btn" [disabled]="loading">
        {{ loading ? 'Iniciando sesión...' : 'Iniciar sesión' }}
      </button>
      <p class="error" *ngIf="errorMessage" role="alert">{{ errorMessage }}</p>
    </form>

    <p class="auth-switch">¿Aún no tienes cuenta? <a routerLink="/registro">Crear cuenta</a></p>
  </section>
</main>
