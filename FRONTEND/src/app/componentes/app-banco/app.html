<header class="topbar">
    <div class="topbar-inner">
        <a routerLink="/app" aria-label="Ir al inicio"><img src="/img/logo2.jpeg" alt="logo" class="logo"></a>
        <h1 class="brand">LCDKK</h1>
        <a routerLink="/cuenta" class="icon-btn" id="profileBtn">Perfil</a>
    </div>
</header>

<main class="container">
    <section class="balance-card">
        <div class="balance-left">
            <p class="small">Saldo disponible</p>
            <h2 id="balance">Cargando saldo...</h2>
        </div>
        <div class="balance-right">
            <button class="primary" id="pagarBtn" type="button">Pagar</button>
            <button class="outline" id="transferirBtn" type="button">Transferir</button>
        </div>
    </section>

    <section class="quick-actions">
        <button class="action" id="cargarBtn">Depositar</button>
        <button class="action" id="recargarBtn">Recargar celular</button>
        <button class="action" id="serviciosBtn">Servicios</button>
        <button class="action" id="qrBtn">Generar QR</button>
    </section>

    <section class="transactions">
        <div class="transactions-header">
            <h3>Últimas actividades</h3>
            <button id="verTodas" class="link-btn">Ver Todas</button>
        </div>
        <ul id="txList" class="tx-list">
            <!-- transacciones renderizadas por JS -->
        </ul>
    </section>
</main>

<nav class="bottom-nav">
    <span class="nav-indicator" aria-hidden="true"></span>
    <a routerLink="/app" class="nav-item active">Inicio</a>
    <a routerLink="/movimientos" class="nav-item">Movimientos</a>
    <a routerLink="/cuenta" class="nav-item">Cuenta</a>
    <a routerLink="/mas" class="nav-item">Más</a>
</nav>

<div id="modal" class="modal hidden">
    <div class="modal-panel">
        <button id="closeModal" class="close">×</button>
        <h3>Historial completo</h3>
        <ul id="modalList" class="tx-list"></ul>
    </div>
</div>

<div id="paymentToast" class="toast hidden" role="status" aria-live="polite">
    Pago realizado con éxito
</div>
