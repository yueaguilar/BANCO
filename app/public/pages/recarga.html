<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>LCDK | Recarga</title>
        <link rel="icon" type="image/png" href="../aseets/logo2.png">
        <link rel="stylesheet" href="../css/app.css">
        <link rel="stylesheet" href="../css/recarga.css">
    </head>
    <body>
        <header class="topbar">
            <div class="topbar-inner">
                <a href="app.html" class="icon-btn back-btn" aria-label="Volver al inicio">← Volver</a>
                <h1 class="brand">LCDKK</h1>
                <a href="cuenta.html" class="icon-btn">Perfil</a>
            </div>
        </header>

        <main class="recarga-shell">
            <section class="recarga-header">
                <div>
                    <p class="eyebrow">Recarga</p>
                    <h2>Recargar celular</h2>
                </div>
                <button class="tag-btn" id="quickRechargeBtn" type="button">Recarga rápida</button>
            </section>

            <section class="recarga-card">
                <div class="destination-row">
                    <div class="destination-meta">
                        <span class="label">Celular</span>
                        <strong id="phonePreview">+54 11 2345-6789</strong>
                    </div>
                    <button class="chip-btn" id="changeCarrierBtn" type="button">Cambiar</button>
                </div>

                <label class="field-label" for="phoneInput">Número</label>
                <div class="phone-box">
                    <span class="country-code">+54</span>
                    <input id="phoneInput" type="tel" inputmode="numeric" maxlength="12" value="1123456789" placeholder="1123456789">
                </div>

                <label class="field-label">Operador</label>
                <div class="carrier-options" role="group" aria-label="Operadores">
                    <button class="carrier active" type="button" data-carrier="Personal">Telcel</button>
                    <button class="carrier" type="button" data-carrier="Claro">Claro</button>
                    <button class="carrier" type="button" data-carrier="Movistar">Movistar</button>
                </div>

                <label class="field-label" for="amountInput">Monto</label>
                <div class="amount-box">
                    <span class="currency">$</span>
                    <input id="amountInput" type="number" min="1" step="0.01" value="1500" placeholder="0,00">
                </div>

                <div class="summary-box">
                    <div class="summary-line">
                        <span>Monto</span>
                        <strong id="summaryAmount">$ 1.500,00</strong>
                    </div>
                    <div class="summary-line">
                        <span>Comisión</span>
                        <strong id="summaryFee">$ 0,00</strong>
                    </div>
                    <div class="summary-line total">
                        <span>Total</span>
                        <strong id="summaryTotal">$ 1.500,00</strong>
                    </div>
                </div>
            </section>

            <div class="recarga-actions">
                <button id="cancelBtn" type="button" class="secondary-btn">Cancelar</button>
                <button id="confirmBtn" type="button" class="primary-btn">Confirmar recarga</button>
            </div>
        </main>

        <div id="successModal" class="success-modal hidden" role="dialog" aria-modal="true">
            <div class="success-card">
                <div class="success-icon">✓</div>
                <h3>¡Recarga realizada!</h3>
                <p id="successMessage">Tu recarga de $ 1.500,00 fue realizada.</p>
                <button id="backHomeBtn" type="button" class="primary-btn full">Volver al inicio</button>
            </div>
        </div>

        <script src="../js/recarga.js"></script>
    </body>
</html>
