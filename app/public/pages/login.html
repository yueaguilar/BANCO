<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>LCDK</title>
        <link rel="icon" type="image/png" href="../aseets/logo2.png">
        <link rel="stylesheet" href="../css/login.css">
    </head>
    <body>
        <div class="inicio">
            <h1 id="titulo">Inicio de sesion o Regsitro de nueva cuenta</h1>
        </div>
        <div class="info">
            <form class="login-form" action="app.html" method="get">
                <input class="correo liquid-glass-input" type="email" name="email" placeholder="Correo electrónico" required>
                <input class="liquid-glass-input" type="text" name="fullname" placeholder="Nombre completo" required>
                <label class="small">Fecha de nacimiento</label>
                <input class="liquid-glass-input" type="date" name="birthdate">
                <input class="liquid-glass-input" type="password" name="password" placeholder="Contraseña" required>
                <button type="submit" class="correo liquid-glass-btn">Crear cuenta / Iniciar sesión</button>
            </form>
        </div>
        <script src="../js/login.js"></script>
    </body>
</html>
