<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Verificación</title>
        <link rel="stylesheet" href="../css/veri.css">
    </head>
    <body>
        <main class="verification-shell">
            <section class="verification-card">
                <div class="brand-wrap">
                    <img src="../aseets/logo2.png" alt="Banco Ficticio" class="brand-logo" />
                    <h1>Verifica tu identidad</h1>
                </div>

                <p class="lead">
                    Te enviamos un código de 6 dígitos al número <strong id="verification-phone">-</strong>.
                </p>

                <form id="verification-form" class="verification-form">
                    <label for="verification-code">Código de verificación</label>
                    <input id="verification-code" class="verification-input" type="text" inputmode="numeric" maxlength="6" placeholder="123456" required>

                    <button type="submit" class="primary-btn">Confirmar código</button>
                </form>

                <div class="actions">
                    <button type="button" id="resend-code" class="secondary-btn">Reenviar código</button>
                    <a href="/login.html" class="text-link">Cancelar</a>
                </div>
                <p id="verification-message" class="status-message" aria-live="polite"></p>
            </section>
        </main>

        <script src="../js/veri.js"></script>
    </body>
</html>
