<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>LCDK | Pago</title>
        <link rel="icon" type="image/png" href="../aseets/logo2.png">
        <link rel="stylesheet" href="../css/app.css">
        <link rel="stylesheet" href="../css/pago.css">
    </head>
    <body>
        <header class="topbar">
            <div class="topbar-inner">
                <a href="app.html" class="icon-btn back-btn" aria-label="Volver al inicio">← Volver</a>
                <h1 class="brand">LCDKK</h1>
                <a href="cuenta.html" class="icon-btn">Perfil</a>
            </div>
        </header>

        <main class="payment-shell">
            <section class="payment-header">
                <div>
                    <p class="eyebrow">Pago</p>
                    <h2>Nuevo pago</h2>
                </div>
                <button class="tag-btn" id="quickPayBtn" type="button">Pago rápido</button>
            </section>

            <section class="payment-card">
                <div class="destination-row">
                    <div class="destination-meta">
                        <span class="label">Destino</span>
                        <strong id="destinoLabel">Supermercado</strong>
                    </div>
                    <button class="chip-btn" id="changeDestinyBtn" type="button">Cambiar</button>
                </div>

                <label class="field-label" for="amountInput">Monto</label>
                <div class="amount-box">
                    <span class="currency">$</span>
                    <input id="amountInput" type="number" min="1" step="0.01" value="450.20" placeholder="0,00">
                </div>

                <label class="field-label" for="conceptInput">Concepto</label>
                <input id="conceptInput" class="text-input" type="text" value="Pago de supermercado" maxlength="40">

                <label class="field-label">Método de pago</label>
                <div class="payment-methods">
                    <button class="method active" type="button" data-method="saldo">Saldo disponible</button>
                    <button class="method" type="button" data-method="tarjeta">Tarjeta</button>
                    <button class="method" type="button" data-method="transferencia">Transferencia</button>
                </div>

                <div class="summary-box">
                    <div class="summary-line">
                        <span>Monto</span>
                        <strong id="summaryAmount">$ 450,20</strong>
                    </div>
                    <div class="summary-line">
                        <span>Comisión</span>
                        <strong id="summaryFee">$ 0,00</strong>
                    </div>
                    <div class="summary-line total">
                        <span>Total</span>
                        <strong id="summaryTotal">$ 450,20</strong>
                    </div>
                </div>
            </section>

            <div class="payment-actions">
                <button id="cancelBtn" type="button" class="secondary-btn">Cancelar</button>
                <button id="confirmBtn" type="button" class="primary-btn">Confirmar pago</button>
            </div>
        </main>

        <div id="successModal" class="success-modal hidden" role="dialog" aria-modal="true">
            <div class="success-card">
                <div class="success-icon">✓</div>
                <h3>¡Pago realizado!</h3>
                <p id="successMessage">Tu pago por $ 450,20 fue confirmado.</p>
                <button id="backHomeBtn" type="button" class="primary-btn full">Volver al inicio</button>
            </div>
        </div>

        <script src="../js/pago.js"></script>
    </body>
</html>
