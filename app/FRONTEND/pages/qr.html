<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>LCDK | QR de transferencia</title>
        <link rel="icon" type="image/png" href="../aseets/logo2.png">
        <link rel="stylesheet" href="../css/app.css">
        <link rel="stylesheet" href="../css/qr.css">
    </head>
    <body>
        <header class="topbar">
            <div class="topbar-inner">
                <a href="app.html" class="icon-btn back-btn" aria-label="Volver al inicio">← Volver</a>
                <h1 class="brand">LCDKK</h1>
                <a href="cuenta.html" class="icon-btn">Perfil</a>
            </div>
        </header>

        <main class="qr-shell">
            <section class="qr-card">
                <div class="section-header">
                    <div>
                        <p class="eyebrow">Transferencia</p>
                        <h2>Generar QR de pago</h2>
                    </div>
                    <button class="tag-btn" id="fillDemoBtn" type="button">Usar ejemplo</button>
                </div>

                <form id="qrForm" class="qr-form">
                    <div class="field-group">
                        <label class="field-label" for="recipientName">Destinatario</label>
                        <input id="recipientName" class="text-input" type="text" value="" maxlength="40" placeholder="Ingresá el destinatario">
                    </div>

                    <div class="field-group">
                        <label class="field-label" for="recipientAlias">Alias / CVU</label>
                        <input id="recipientAlias" class="text-input" type="text" value="" maxlength="40" placeholder="Ingresá el alias">
                    </div>

                    <div class="field-group">
                        <label class="field-label" for="accountNumber">Número de cuenta</label>
                        <input id="accountNumber" class="text-input" type="text" inputmode="numeric" pattern="[0-9]*" value="" maxlength="20" placeholder="Ingresá el número de cuenta">
                    </div>

                    <div class="field-group">
                        <label class="field-label" for="concept">Concepto</label>
                        <input id="concept" class="text-input" type="text" value="" maxlength="50" placeholder="Ingresá el concepto">
                    </div>

                    <div class="field-group">
                        <label class="field-label" for="amount">Monto</label>
                        <div class="amount-box">
                            <span class="currency">$</span>
                            <input id="amount" type="number" min="1" step="0.01" value="" placeholder="0,00">
                        </div>
                    </div>

                    <div class="form-actions">
                        <button id="backBtn" type="button" class="secondary-btn">Cancelar</button>
                        <button type="submit" class="primary-btn">Generar QR</button>
                    </div>
                </form>
            </section>

            <section class="qr-preview-card">
                <div class="qr-preview-header">
                    <h3>QR listo para compartir</h3>
                    <span class="status-badge">Activo</span>
                </div>

                <div class="qr-image-wrap">
                    <img id="qrImage" alt="Código QR de transferencia" src="">
                </div>

                <div class="preview-actions">
                    <button id="copyBtn" type="button" class="ghost-btn">Copiar datos</button>
                </div>
            </section>
        </main>

        <script src="../js/qr.js"></script>
    </body>
</html>
